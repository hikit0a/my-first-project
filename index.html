<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 320px;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #000;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 32px;
            text-align: right;
            padding: 10px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            background: #444;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            background: #555;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffaa22;
        }

        .clear {
            background: #d93636;
        }

        .equal {
            background: #28a745;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button onclick="addValue('%')">%</button>
        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button class="zero" onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>
</div>

<script>
    const display = document.getElementById("display");

    function addValue(value) {
        if (display.value === "0") {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);

        if (display.value === "") {
            display.value = "0";
        }
    }

    function calculate() {
        try {
            let expression = display.value.replace("%", "/100");
            let result = Function('"use strict"; return (' + expression + ')')();

            display.value = result;
        } catch {
            display.value = "Помилка";
        }
    }

    // Клавіатура
    document.addEventListener("keydown", function(event) {

        if (
            "0123456789+-*/.%".includes(event.key)
        ) {
            addValue(event.key);
        }

        if (event.key === "Enter") {
            calculate();
        }

        if (event.key === "Escape") {
            clearDisplay();
        }

        if (event.key === "Backspace") {
            deleteLast();
        }
    });
</script>

</body>
</html>
